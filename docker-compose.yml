version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: hostelsync-postgres
    environment:
      POSTGRES_DB: hostelsync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./hostelsync-backend
      dockerfile: Dockerfile
    container_name: hostelsync-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hostelsync
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      JWT_SECRET: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./hostelsync-frontend
      dockerfile: Dockerfile
    container_name: hostelsync-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
